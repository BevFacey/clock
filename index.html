<!DOCTYPE html>
<html>
<head>
    <title>Facey Countdown Clock</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
<div id="day" style="text-align: center; font-size: 500%;"></div>
<div id="date" style="text-align: center; font-size: 500%;"></div>
<div id="time" style="text-align: center; font-size: 900%;"></div>
<div id="period" style="text-align: center; font-size: 400%;"></div>
<div id="periodCountdown" style="text-align: center; font-size: 500%;"></div>

<script>
  var periods = ["Warning","Block 1","Break","Block 2","Lunch","Warning","Block 3","Break","Block 4"]  // there is no period name for the end of the day
  
  var period;
  var startTime;
  var endTime;
  var difference;
  var displayedDate;

  function createDateTime(startTime) {
    var currentDate = new Date();
    currentDate.setHours(startTime.split(":")[0]);
    currentDate.setMinutes(startTime.split(":")[1]);
    currentDate.setSeconds(0);
    return currentDate;
  }

  var x = setInterval(function() {
    var dateNow = new Date();

    // reload the page if the date has changed
    var currentDate = [dateNow.getFullYear(), dateNow.getMonth(), dateNow.getDate()].join("-");
    if (displayedDate && currentDate !== displayedDate) {location.reload();}
    displayedDate = currentDate;
    
    var weekdayNumber = dateNow.getDay();
    const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    var weekday = weekdays[weekdayNumber];
    var hour = dateNow.getHours();
    var ampm = "AM";
    if (hour > 11) {ampm = "PM";}
    if (hour > 12) {hour = hour - 12;}
    var minute = dateNow.getMinutes();
    if (minute < 10) {minute = "0" + minute;}
    //var ampm = dateNow.getHours() >= 12 ? "PM" : "AM";
    document.getElementById("day").innerHTML = weekday;
    document.getElementById("date").innerHTML = dateNow.toISOString().split("T")[0];
    document.getElementById("time").innerHTML = hour + ":" + minute + " " + ampm;
    document.getElementById("periodCountdown").style.color = "blue";

    // Saturday or Sunday
    if (dateNow.getDay() === 0 || dateNow.getDay() === 6) {
      document.body.style.backgroundColor = "#202020";
    } else {
      document.body.style.backgroundColor = "white";
      //if (day < 8 && dateNow.getDay() == 3) { // first Wednesday of the month
      
      if (dateNow.getMonth() === 7 && dateNow.getDate() === 31 && dateNow.getFullYear() === 2026) { // August 31 half day full schedule
        var startTimes = ["12:15", // Warning
                          "12:16", // Block 1
                          "12:56", // Break
                          "13:03", // Block 2
                          "13:43", // Lunch
                          "13:49", // Warning
                          "13:50", // Block 3
                          "14:30", // Break
                          "14:37", // Block 4
                          "15:17"  // End of the day
                        ];}

      else if (dateNow.getMonth() === 8 && dateNow.getDate() === 11 && dateNow.getFullYear() === 2026) { // September 11 pep rally schedule
        periods = ["Warning","Block 1","Assembly","Block 2","Lunch","Warning","Block 3","Break","Block 4"]
        var startTimes = ["8:30",  // Warning
                          "8:35",  // Block 1
                          "9:40", // Assembly
                          "10:45", // Block 2
                          "12:00", // Lunch
                          "12:53", // Warning
                          "12:58", // Block 3
                          "14:03", // Break
                          "14:11", // Block 4
                          "15:17"  // End of the day
                        ];}

      else if (dateNow.getDay() == 3) { // Opportunity Wednesday
        var startTimes = ["8:30",  // Warning
                          "8:35",  // Block 1
                          "9:46",  // Break
                          "9:53",  // Block 2
                          "11:04", // Lunch
                          "11:43", // Warning
                          "11:48", // Block 3
                          "12:59", // Warning
                          "13:06", // Block 4
                          "14:17"  // End of the day
                        ];} 
      else {
        var startTimes = ["8:30",  // Warning
                          "8:35",  // Block 1
                          "10:02", // Break
                          "10:09", // Block 2
                          "11:36", // Lunch
                          "12:11", // Warning
                          "12:16", // Block 3
                          "13:43", // Break
                          "13:50", // Block 4
                          "15:17"  // End of the day
                        ];}
      
      // test if current datetime is greater than period start time
      for (var i = 0; i < periods.length; i++) {
        startTime = createDateTime(startTimes[i]);
        endTime = createDateTime(startTimes[i + 1]);
        if (dateNow >= startTime && dateNow < endTime) {
          difference = endTime - dateNow;
          period = periods[i];
          break;
        }
        else {
          difference = "";
          period = "";
        }
      }
      // calculate hours, minutes, and seconds for countdown display
      var hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      var minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      var seconds = Math.floor((difference % (1000 * 60)) / 1000);
      
      // set up countdown display
      if (seconds < 10) {
        seconds = "0" + seconds;
      }
      if (hours > 0) {
        if (minutes < 10) {
          minutes = "0" + minutes;
        }
        document.getElementById("periodCountdown").innerHTML = hours + ":" + minutes + ":" + seconds;
        //document.getElementById("periodCountdown").style.color = "blue";
      } else {
        document.getElementById("periodCountdown").innerHTML = minutes + ":" + seconds;
        //document.getElementById("periodCountdown").style.color = "blue";

        // set text color to red if < 2 minutes
        if (minutes < 2) {
          document.getElementById("periodCountdown").style.color = "red";
        }

        // hide countdown at the end of the day
        if (minutes == 0 && seconds == 0) {
          document.getElementById("periodCountdown").style.color = "white";
        }
      }
      document.getElementById("period").innerHTML = period;
      document.getElementById("period").style.color = "blue";

    }
  }, 1000); // updating setInterval every 1000 milliseconds
</script>
</body>
</html>
